<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bgcolor change acc. to hyperlink</title>
</head>
<body>
    <a href="#" onclick="changeBgColor('white')">white</a><br>
    <a href="#" onclick="changeBgColor('red')">red</a><br>
    <a href="#" onclick="changeBgColor('blue')">blue</a><br>
    <a href="#" onclick="changeBgColor('pink')">pink</a><br>

    <script>
        function changeBgColor(color){
            document.body.style.backgroundColor = color;
        }
    </script>
</body>
</html>
