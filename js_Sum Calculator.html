<!-- Create an HTML page with two textboxes and a Calculate button:
     When the user enters the numbers and clicks the Calculate button, it has to alert the sum. -->

<!DOCTYPE html>
<html>

<head>
    <title>Sum Calculator</title>
</head>

<body>

<h3>Sum of Two Numbers</h3>

<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">

<br><br>

<button onclick="calculateSum()">Calculate</button>

<script>
function calculateSum() {
    let n1 = document.getElementById("num1").value;
    let n2 = document.getElementById("num2").value;

    let sum = Number(n1) + Number(n2);

    alert("Sum = " + sum);
}
</script>

</body>
</html>
